<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Nimitha — Software Developer</title>
  <desc id="desc">A dark, gradient banner for Nimitha's full-stack, AI, and systems portfolio.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1020"/>
      <stop offset="0.58" stop-color="#111a31"/>
      <stop offset="1" stop-color="#1b1735"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#73f2c2" stop-opacity=".24"/>
      <stop offset="1" stop-color="#73f2c2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop stop-color="#82f4c7"/>
      <stop offset="1" stop-color="#9bc7ff"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#b9c8e8" stroke-opacity=".055"/>
    </pattern>
  </defs>
  <rect width="1200" height="320" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="28" fill="url(#grid)"/>
  <circle cx="1060" cy="45" r="280" fill="url(#glow)"/>
  <path d="M790 320 1120-10M875 340 1205 10M1010 340 1280 70" fill="none" stroke="#9bc7ff" stroke-opacity=".1" stroke-width="1.5"/>
  <circle cx="1060" cy="160" r="92" fill="#0b1225" fill-opacity=".34" stroke="#a5f5d6" stroke-opacity=".25"/>
  <circle cx="1060" cy="160" r="70" fill="none" stroke="url(#accent)" stroke-opacity=".55" stroke-width="1.5"/>
  <path d="M1018 160h84M1060 118v84" stroke="#b6f7dc" stroke-opacity=".23"/>
  <circle cx="1060" cy="160" r="5" fill="#8df3c9"/>
  <text x="76" y="75" fill="#8df3c9" font-family="SFMono-Regular,Consolas,monospace" font-size="15" letter-spacing="3">FULL-STACK DEVELOPMENT · AI · SYSTEMS</text>
  <text x="72" y="176" fill="#f5f7ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="82" font-weight="700" letter-spacing="-2">Nimitha</text>
  <text x="78" y="225" fill="#bec9df" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20">Thoughtful software for learning, collaboration, and everyday workflows.</text>
  <rect x="78" y="260" width="174" height="3" rx="2" fill="url(#accent)"/>
</svg>